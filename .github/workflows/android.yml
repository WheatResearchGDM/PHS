name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare SDK and test signing
        run: |
          # GitHub's Android SDK is already installed on ubuntu-24.04.
          # Do not request the removed legacy package "tools".
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || sdkmanager 'platforms;android-35'
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt2" || sdkmanager 'build-tools;35.0.0'
          mkdir -p .tools
          keytool -genkeypair -keystore .tools/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=PHS CI Test Build,O=PHS,C=BR' -keyalg RSA -keysize 2048 -validity 10000
      - name: Validate and build
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PHS-Reader-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
