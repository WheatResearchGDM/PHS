name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare SDK and test signing
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p .tools
          keytool -genkeypair -keystore .tools/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=PHS CI Test Build,O=PHS,C=BR' -keyalg RSA -keysize 2048 -validity 10000
      - name: Validate and build
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PHS-Reader-0.1.0-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
