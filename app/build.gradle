plugins { id 'com.android.application' }

android {
    namespace 'br.com.phs.coleta'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.phs.coleta'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { debug { storeFile rootProject.file('.tools/debug.keystore') } }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2' }
    }
}
dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
